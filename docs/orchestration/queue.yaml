# Проверяльщик: `python tools/queue_check.py` (0 = очередь согласована,
# 1 = найдено нарушение, 2 = файл нечитаем). Он ничего не запускает и не
# интегрирует: только читает и объясняет.
#
# Состояния: BACKLOG READY ASSIGNED RUNNING REVIEW ACCEPTED INTEGRATED VERIFIED
#             BLOCKED FAILED RECOVERY_REQUIRED CANCELLED DEFERRED
# Правило one-state: запись не может быть одновременно RUNNING и INTEGRATED;
# проверяльщик на это смотрит отдельно (см. `history`).

