# Это НЕ вторая дорожная карта. Продуктовый статус блоков живёт только в
# `docs/EXECUTION_PLAN.md` (реестр P1…P108); здесь — выполняемые задания, ссылки
# на P-пункты (`p_refs`) и то, что диспетчер обязан знать, чтобы не устроить
# конфликт: владелец, база, разрешённые пути, зависимости и состояние.
