# =============================================================================
# Source registry. NO Telegram scraping — the API Terms forbid using platform
# data for AI workloads, and mass scraping ends in bans. Everything here is a
# primary or secondary public news source with a documented feed.
#
# Every URL below was verified to return 200 with entries at authoring time.
# Several well-known feeds (NIH, MedicalXpress, CryptoSlate, CBR) sit behind bot
# protection or have moved their RSS paths and are deliberately absent.
#
# kind:
#   rss    — static feed URL
#   gnews  — Google News RSS query; {{Q}} is percent-encoded automatically
#   gdelt  — GDELT DOC 2.0 article list
#
# weight feeds `heat`. The `niches` list steers items toward channels.
# =============================================================================

defaults: &defaults
  kind: rss
  lang: ru
  weight: 0.55
  min_interval_s: 900
  enabled: true

