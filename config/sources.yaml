    lang: en
    niches: [tech, science]
    weight: 0.50
    # GDELT rate-limits aggressively per source IP; a short interval just burns
    # requests and returns 429
    min_interval_s: 3600
    params:
      query: "artificial intelligence"
      maxrecords: 40
      timespan: 6h
  # ============================================================== REDDIT
  # `.rss` feeds. Reddit wants a descriptive User-Agent, which the collector sets.
  #
  # Reddit rate-limits by IP far more aggressively than anyone else and the limit
  # here is roughly one request per 15–30 s, so only ONE subreddit is enabled by
  # default. To add a second, raise HOST_INTERVALS["www.reddit.com"] in
  # tgfarm/s1_sources/base.py to 20–30 and expect slower collection.
  - <<: *defaults
    id: reddit_local
    name: "Reddit: r/LocalLLaMA"
    kind: reddit
    url: ""
    lang: en
    niches: [tech]
    weight: 0.50
    min_interval_s: 1800
    params: {subreddit: LocalLLaMA, sort: hot}

