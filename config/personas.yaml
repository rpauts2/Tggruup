# =============================================================================
# Channel personas. One entry = one publishing channel.
# Consumed by: S3 router (voice), S4 generation, S5 quality gates,
#              S6 visual renderer (palette), S7 scheduler (cadence).
#
# Режим «два канала обо всём»: Дзен + ВК, оба catch_all — берут каждый кластер.
# Полный набор нишевых персон (tech, business, crypto, science, health, city,
# uz) лежит в config/personas.archive.yaml и возвращается копированием файла.
#
# Тон: сухая ирония и лёгкий юмор, без кликбейта. Юмор — приправа, не блюдо:
# одна шутка на пост, и она не должна быть в хуке.
# =============================================================================

defaults: &defaults
  platform: telegram
  catch_all: false
  language: ru
  timezone: Europe/Moscow
  posts_per_day: 3
  enabled: false
  min_chars: 150
  max_chars: 600
  emoji_policy: max_1
  cta_policy: never          # never | sometimes | always
  always_cite_sources: true
  max_sources: 3
  angle_weights:
    news: 0.35
    analysis: 0.25
    why_it_matters: 0.15
    checklist: 0.10
    comparison: 0.08
    history: 0.07

channels:
  # ------------------------------------------------------------------ 1. ДЗЕН
  # Первичная площадка, не кросспост: у Дзена свой заголовок, тело и лимит
  # 10 000 символов, поэтому S4 пишет для него отдельный материал.
  # Для основной ленты Дзена S7 действует общий предел 2 публикации за сутки.
  - <<: *defaults
    id: zen_misc_ru
    title: "Всякая всячина"
    niche: general
    platform: dzen
    catch_all: true
    enabled: true
    posts_per_day: 120
    min_chars: 900
    max_chars: 3000
    audience: "читатели Дзена, которым интересно всё понемногу, 25-60"
    tone: [conversational, curious, factual, light_humor, dry_irony]
    style_notes:
      - "Бери только действительно интересные и полезные темы: технологии, деньги, наука, город, здоровье."
      - "Статья должна быть профессиональной, информативной и структурированной: заголовок-факт, 4-6 абзацев по 2-4 предложения, вывод с источниками."
      - "Добавляй контекст и объясняй, почему это важно читателю; не пересказывай источник дословно."
      - "Юмор: одна сухая ироничная фраза на пост, в середине или в конце. Не в заголовке, не в первом абзаце."
      - "Шутка не должна быть про жертв, болезни, деньги читателя или его внешность. Ирония — про ситуацию, а не про людей."
      - "Никаких эмодзи-шуток, сарказма в кавычках и 'ну вы поняли'. Если шутка не получается — пиши без неё."
      - "Каждая цифра с единицами измерения и источником; никаких выдуманных фактов."
      - "Заголовок — конкретный, без кликбейта и обещаний."
    banned_words: [шок, сенсация, не поверите, только сегодня, гарантированно, 100%,
                   лол, ржу, ахах, тrolling]
    hashtags: [Дзен, Обзор]
    angle_weights:
        news: 0.25
        analysis: 0.20
        why_it_matters: 0.15
        checklist: 0.10
        comparison: 0.10
        history: 0.05
        listicle: 0.15
    palette: {bg: "#101014", fg: "#F2F2F5", accent: "#FFCC00", muted: "#77777F"}
    cta: null

  # -------------------------------------------------------------------- 2. ВК
  # Своя площадка со своим форматом: ВК не любит простыни, поэтому бюджет
  # короче Дзена, а ссылки и хештеги уходят в конец. Публикуется напрямую
  # через wall.post (см. S7), а не кросспостом из Дзена.
  - <<: *defaults
    id: vk_misc_ru
    title: "Всякая всячина — ВК"
    niche: general
    platform: vk
    catch_all: true
    enabled: true
    posts_per_day: 48      # Индивидуальная генерация; S7 применяет общий лимит платформы.
    min_chars: 350
    max_chars: 900
    audience: "лента ВК, случайные читатели, которые листают между делами, 20-55"
    tone: [conversational, curious, factual, light_humor, dry_irony]
    style_notes:
      - "Пиши как человек, который первым прочитал новость и пересказывает её другу: коротко, по делу, с одной ироничной деталью."
      - "Первый абзац — суть и цифра. Дальше — почему это важно и что будет дальше. Всё, без предисловий."
      - "Юмор: одна сухая фраза на пост. Не шути про жертв, болезни и деньги читателя."
      - "Никаких 'ставьте лайк', 'подписывайтесь', 'а вы как думаете'. Призывов нет вообще."
      - "Ссылка на источник — в конце, одной строкой. Хештеги — 3 штуки, не больше."
      - "Не повторяй заголовок в первом предложении: заголовок и тело должны добавлять друг друга."
    banned_words: [шок, сенсация, не поверите, только сегодня, гарантированно, 100%,
                   ставьте лайк, подписывайтесь, репост, лол, ахах]
    hashtags: [ВК, Обзор, Интересное]
    angle_weights:
        news: 0.45
        analysis: 0.10
        why_it_matters: 0.15
        checklist: 0.10
        comparison: 0.05
        history: 0.05
        listicle: 0.10
    palette: {bg: "#0E1621", fg: "#EAF1F8", accent: "#4C8DFF", muted: "#6B7A8C"}
    cta: null
