# =============================================================================
# Publishing cadence, derived from measured Telegram distribution data
# (1 090 471 posts / week, list.tg + TGScope census 2026).
#
# Hour weights are share-of-daily-posts converted to local time (MSK = UTC+3).
# The scheduler samples slots proportional to these weights instead of using a
# flat spread, so the farm lands on the same hours the whole platform is busy.
# =============================================================================

timezone: Europe/Moscow

# share of all Telegram posts published in each local hour (normalised later)
hour_weights:
  "6":  0.10   # 09 MSK — morning peak
  "7":  0.18   # 10
  "8":  0.26   # 11
  "9":  0.30   # 12
  "10": 0.33   # 13
  "11": 0.35   # 14
  "12": 0.40   # 15
  "13": 0.48   # 16
  "14": 0.62   # 17  ← global peak hour
  "15": 0.80   # 18  ← absolute maximum
  "16": 0.58   # 19
  "17": 0.36   # 20
  "18": 0.24   # 21
  "19": 0.12   # 22
  "20": 0.05   # 23
  "21": 0.03
  "22": 0.02
  # 23:00–05:00 local = dead zone, never scheduled

# share of weekly posts by weekday
day_weights:
  mon: 0.157
  tue: 0.176
  wed: 0.168
  thu: 0.171
  fri: 0.169
  sat: 0.142
  sun: 0.136

jitter:
  # minutes of random offset around the nominal slot — spreads the fleet so the
  # channels never look synchronised
  min: 8
  max: 40

# Cadence modes:
#   weights  — sample hour/day from the distribution above (classic editorial
#              rhythm: morning, lunch, evening peak).
#   interval — hold a fixed gap between posts of the same channel, all day.
#              Used by the two-channel continuous mode: a post every 5-10
#              minutes means slots come from the gap, not from the peak table.
cadence:
  mode: interval
  min_gap_s: 300
  max_gap_s: 620
  # null = 24/7. Set e.g. [7, 23] to keep the night quiet and let the queue
  # drain in the morning instead.
  active_hours: null

# how many posts go out across the whole fleet within one hour — a soft ceiling
# that keeps the fleet from looking co-ordinated
fleet_posts_per_hour: 30

# external distribution behaviour
# Destination selection and daily budgets are calculated by tgfarm.distribution:
# topic fit, source niche, editorial quality, freshness, prior deliveries,
# near-duplicate detection and a per-platform minimum gap.
crosspost:
  # enabled platforms at first launch; after that the UI switches are authoritative
  platforms: [max, vk, x]
  # wait until the primary post has settled before selecting external destinations
  delay_min: 25