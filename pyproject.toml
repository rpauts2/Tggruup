[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgfarm"
version = "1.2.0"
description = "Autonomous Telegram channel farm: trend detection, content generation, visual rendering, publishing, analytics, crossposting."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "aiogram>=3.13",
    "APScheduler>=3.10",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "Pillow>=10.3",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "telethon>=1.34",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
# Dzen has no publishing API; this drives its web editor in a real browser.
dzen = ["playwright>=1.49"]
# The desktop shell. Optional on purpose: the pipeline, the CLI and the test
# suite must run on a headless server without a GUI stack installed.
desktop = ["pywebview>=5.0", "pystray>=0.19", "playwright>=1.49"]
build = ["pyinstaller>=6.6"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
tgfarm = "tgfarm.cli:main"

[tool.setuptools.packages.find]
include = ["tgfarm*"]

[tool.setuptools.package-data]
# Only globs that exist. A pattern matching nothing is not an error, but it
# reads like a guarantee that is not there.
tgfarm = [
  "ui/*.html",
  "ui/*.css",
  "ui/*.js",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "w17chain: offline end-to-end autonomy chain; no outbound call may leave the process",
]