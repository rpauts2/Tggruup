name: UI Visual QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/desktop-command-center-ui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dashboard test dependencies
        run: python -m pip install -e ".[dev,dzen]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser visual smoke tests
        env:
          TGFARM_VISUAL_QA: "1"
        run: python -m pytest tests/ui_visual -q

      - name: Upload dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgfarm-ui-visual-${{ github.run_number }}
          path: artifacts/ui-visual/
          if-no-files-found: warn
          retention-days: 14
