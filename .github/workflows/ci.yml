name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e ".[dev,dzen]"

      - name: Compile Python modules
        run: python -m compileall -q tgfarm tests

      - name: Run test suite
        env:
          TGFARM_MODE: off
          LLM_PROVIDERS: offline
          EMBEDDING_PROVIDER: local
          IMAGE_ENABLED: "false"
          VIDEO_ENABLED: "false"
        run: python -m pytest -q
