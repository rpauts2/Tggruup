name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e ".[dev,dzen]"

      - name: Compile Python modules
        run: python -m compileall -q tgfarm tests

      - name: Check dashboard JavaScript syntax
        run: node --check tgfarm/ui/app.js

      - name: Run test suite
        env:
          TGFARM_MODE: off
          LLM_PROVIDERS: offline
          EMBEDDING_PROVIDER: local
          IMAGE_ENABLED: "false"
          VIDEO_ENABLED: "false"
        run: python -m pytest -q

      - name: Run offline end-to-end smoke cycle
        env:
          TGFARM_MODE: off
          LLM_PROVIDERS: offline
          EMBEDDING_PROVIDER: local
          IMAGE_ENABLED: "false"
          VIDEO_ENABLED: "false"
          DATABASE_URL: sqlite:////tmp/tgfarm-ci-smoke.db
        run: python -m tgfarm.cli demo --cycles 1

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test, desktop, and build dependencies
        run: python -m pip install -e ".[dev,dzen,desktop,build]"

      - name: Compile Python modules
        run: python -m compileall -q tgfarm tests

      - name: Check dashboard JavaScript syntax
        run: node --check tgfarm/ui/app.js

      - name: Run test suite
        env:
          TGFARM_MODE: off
          LLM_PROVIDERS: offline
          EMBEDDING_PROVIDER: local
          IMAGE_ENABLED: "false"
          VIDEO_ENABLED: "false"
        run: python -m pytest -q

      - name: Run offline end-to-end smoke cycle
        env:
          TGFARM_MODE: off
          LLM_PROVIDERS: offline
          EMBEDDING_PROVIDER: local
          IMAGE_ENABLED: "false"
          VIDEO_ENABLED: "false"
          DATABASE_URL: sqlite:///./tgfarm-ci-smoke.db
        run: python -m tgfarm.cli demo --cycles 1

      - name: Build Windows desktop application
        run: python -m PyInstaller packaging/tgfarm.spec --noconfirm

      - name: Verify Windows executable
        run: |
          if (!(Test-Path "dist/TgFarm/TgFarm.exe")) {
            throw "Expected dist/TgFarm/TgFarm.exe was not created"
          }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TgFarm-Windows-${{ github.sha }}
          path: dist/TgFarm/
          if-no-files-found: error
