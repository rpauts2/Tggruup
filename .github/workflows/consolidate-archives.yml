name: Consolidate archived functionality into main

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/consolidate-archives.yml"

permissions:
  contents: write

concurrency:
  group: consolidate-archives-main
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history and archived refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Merge non-conflicting archived snapshots into main
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/tags/archive/*:refs/tags/archive/*'
          mapfile -t tags < <(git tag --list 'archive/*' | sort)
          merged=0
          skipped=0
          {
            echo "## Archive consolidation"
            echo
            echo "Starting commit: $(git rev-parse HEAD)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for tag in "${tags[@]}"; do
            if git merge-base --is-ancestor "$tag" HEAD; then
              echo "- Already contained: `$tag`" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "Attempting merge: $tag"
            if git merge -X ours --no-edit --no-ff "$tag" -m "merge: consolidate archived functionality from $tag"; then
              merged=$((merged + 1))
              echo "- Merged: `$tag`" >> "$GITHUB_STEP_SUMMARY"
            else
              git merge --abort || true
              skipped=$((skipped + 1))
              echo "- **Needs manual port due to conflict:** `$tag`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Merged: $merged; conflict-skipped: $skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "FINAL_MERGED=$merged"
          echo "FINAL_SKIPPED=$skipped"
          if [[ "$merged" -gt 0 ]]; then
            git push origin HEAD:main
          fi
